# Pinning every action to a commit SHA (see SECURITY.md, supply-chain row) stops
# a re-pointed tag changing what runs — and stops the pins receiving upstream
# security fixes. Dependabot is the other half of that trade: it opens a PR when
# a pinned action moves, preserving the SHA pin and updating the trailing tag
# comment, so the pins stay current without ever being mutable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
