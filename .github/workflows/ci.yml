name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Type check (mypy)
        run: uv run --python ${{ matrix.python }} mypy src

      - name: Unit tests (pytest)
        run: uv run --python ${{ matrix.python }} pytest tests/unit -v

      - name: docs links
        run: uv run --python ${{ matrix.python }} python scripts/check_docs_links.py

      - name: release hygiene
        run: uv run --python ${{ matrix.python }} python scripts/check_release_hygiene.py

      - name: security doc honesty
        run: uv run --python ${{ matrix.python }} python scripts/check_security_doc.py

  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks-action diffs <sha>^..<sha>, which needs the parent commit.
          # The default shallow checkout has only one commit, so git errors out
          # and the action exits 1 after scanning ~0 bytes — a red check that
          # never actually inspected anything.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
