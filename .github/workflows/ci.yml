name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Type check (mypy)
        run: uv run --python ${{ matrix.python }} mypy src

      - name: Unit tests (pytest)
        run: uv run --python ${{ matrix.python }} pytest tests/unit -v

      - name: docs links
        run: uv run --python ${{ matrix.python }} python scripts/check_docs_links.py

      - name: release hygiene
        run: uv run --python ${{ matrix.python }} python scripts/check_release_hygiene.py

      - name: security doc honesty
        run: uv run --python ${{ matrix.python }} python scripts/check_security_doc.py

  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks-action diffs <sha>^..<sha>, which needs the parent commit.
          # The default shallow checkout has only one commit, so git errors out
          # and the action exits 1 after scanning ~0 bytes — a red check that
          # never actually inspected anything.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
