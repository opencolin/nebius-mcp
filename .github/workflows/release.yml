name: release

# Publishes to PyPI when a version tag is pushed.
#
# Auth is PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# One-time setup on https://pypi.org/manage/account/publishing/:
#   PyPI project name : nebius-mcp
#   Owner             : opencolin
#   Repository        : nebius-mcp
#   Workflow filename : release.yml
#   Environment       : pypi
#
# Release:
#   1. bump `version` in pyproject.toml and move the CHANGELOG Unreleased entries
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in pyproject.toml or the job fails before
# publishing — a mismatch is how a release ends up unusable on PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(uv run --no-project python -c \
            'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Run the full quality gate
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest tests/unit
          uv run python scripts/check_docs_links.py

      - name: Build
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built wheel
        # Install the artifact that will actually be published and confirm the
        # console script works, rather than trusting that the source tree did.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/nebius-mcp --version
          /tmp/smoke/bin/nebius-mcp --check || true  # exits 1 without credentials, which is correct

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nebius-mcp
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
